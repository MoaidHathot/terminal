# OverShell's release of the Windows Terminal WPF control: a tag `wpf-vA.B.YYMMDD.N` builds x64 and
# ARM64, packs OverShell.Terminal.Wpf A.B.YYMMDD.N, attaches the package and the native symbols to a
# GitHub release, and pushes the package to nuget.org through Trusted Publishing (NuGet/login:
# GitHub's OIDC token exchanged for a one-hour key against a policy on nuget.org that names this
# repository and this workflow file - no long-lived secret anywhere). With the AZURE_* secrets of an
# Azure Artifact Signing account present (the same six OverShell's release.yml names), the pack job
# signs the two binaries first; without them the package ships unsigned. A dispatched run is a dry run:
# it builds and packs with the version given and leaves the package as a workflow artifact.
# See build/overshell/README.md.
name: overshell-release

on:
  push:
    tags: ['wpf-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version for the dry run (A.B.YYMMDD.N); nothing is tagged or published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: overshell-release
  cancel-in-progress: false

jobs:
  version:
    name: version
    # Only this repository publishes; a fork of the fork that pushes a tag gets nothing.
    if: github.repository == 'MoaidHathot/terminal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      runner: ${{ steps.v.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          # The build runner comes from the tree (build/overshell/UPSTREAM, see overshell-ci.yml).
          runner="${{ vars.OVERSHELL_RUNNER }}"
          [[ -n "$runner" ]] || runner="$(sed -n 's/^runner=//p' build/overshell/UPSTREAM)"
          [[ -n "$runner" ]] || runner=windows-2022
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#wpf-v}"
            publish=true
          else
            version="${{ inputs.version }}"
            publish=false
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a package version (A.B.YYMMDD.N)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "OverShell.Terminal.Wpf $version (publish: $publish, runner: $runner)"

  build:
    name: build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ needs.version.outputs.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (native${{ matrix.platform == 'x64' && ' + WPF' || '' }})
        run: ./build/overshell/Build.ps1 -Platform ${{ matrix.platform }} -Version ${{ needs.version.outputs.version }} ${{ matrix.platform == 'x64' && '-Wpf' || '' }}

      - name: Collect outputs
        run: |
          New-Item -ItemType Directory -Force out/${{ matrix.platform }}, symbols/${{ matrix.platform }} | Out-Null
          Copy-Item "bin/${{ matrix.platform }}/Release/Microsoft.Terminal.Control/Microsoft.Terminal.Control.dll" out/${{ matrix.platform }}/
          Copy-Item "bin/${{ matrix.platform }}/Release/Microsoft.Terminal.Control/Microsoft.Terminal.Control.pdb" symbols/${{ matrix.platform }}/
          if ('${{ matrix.platform }}' -eq 'x64') {
            Get-ChildItem bin -Recurse -Filter Microsoft.Terminal.Wpf.dll | ForEach-Object {
              $tfm = $_.Directory.Name
              New-Item -ItemType Directory -Force "out/wpf/$tfm" | Out-Null
              Copy-Item (Join-Path $_.DirectoryName 'Microsoft.Terminal.Wpf.*') "out/wpf/$tfm/"
            }
          }
          Get-ChildItem out, symbols -Recurse -File | ForEach-Object { '{0,10:N0} KB  {1}' -f ($_.Length / 1KB), $_.FullName.Substring($PWD.Path.Length + 1) }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-${{ matrix.platform }}
          path: symbols/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: binlog-${{ matrix.platform }}
          path: msbuild-${{ matrix.platform }}.binlog
          if-no-files-found: ignore

  pack:
    name: pack (and sign, when configured)
    needs: [version, build]
    runs-on: windows-2022
    timeout-minutes: 30
    # The "release" environment, so the signing account's federated credential has one stable
    # OIDC subject (repo:MoaidHathot@<owner id>/terminal@<repo id>:environment:release - GitHub's
    # token carries the numeric ids). Signing is optional: with no
    # AZURE_CLIENT_ID secret the two steps are skipped and the package ships the binaries unsigned
    # (OverShell's own release then signs them with its certificate, if it has one).
    environment: release
    permissions:
      contents: read
      id-token: write   # the OIDC token for azure/login
    env:
      VERSION: ${{ needs.version.outputs.version }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: artifacts/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: symbols-*
          path: symbols/

      - name: Signing catalogue
        id: catalog
        run: |
          # Every binary the package will carry: the native DLL per platform, the managed one per
          # target framework. Paths relative to the catalogue's own folder, one per line - the
          # shape azure/artifact-signing-action's files-catalog input expects.
          $root = (Resolve-Path artifacts).Path
          $files = @(Get-ChildItem artifacts -Recurse -File -Include Microsoft.Terminal.Control.dll, Microsoft.Terminal.Wpf.dll)
          if ($files.Count -eq 0) { throw 'no binaries to catalogue under artifacts/' }
          $lines = $files | ForEach-Object { $_.FullName.Substring($root.Length + 1) }
          [IO.File]::WriteAllText((Join-Path $root 'signing-catalog.txt'), (($lines -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
          "Catalogued $($files.Count) file(s):"; $lines | ForEach-Object { "  $_" }
          "signing=$(if ($env:AZURE_CLIENT_ID) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Azure login (OIDC)
        if: steps.catalog.outputs.signing == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the terminal control binaries (Azure Artifact Signing)
        if: steps.catalog.outputs.signing == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-catalog: ${{ github.workspace }}\artifacts\signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Windows Terminal control, built by OverShell's fork
          description-url: https://github.com/MoaidHathot/terminal

      - name: Verify the signatures
        if: steps.catalog.outputs.signing == 'true'
        run: |
          # Signing was configured, so every catalogued file must now carry a valid signature;
          # a package of half-signed binaries under a signed-looking release is worse than none.
          $root = (Resolve-Path artifacts).Path
          $bad = @()
          foreach ($file in (Get-Content artifacts/signing-catalog.txt | Where-Object { $_ })) {
            $s = Get-AuthenticodeSignature (Join-Path $root $file)
            Write-Host "  $file : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { $bad += $file }
          }
          if ($bad.Count -gt 0) { throw "not validly signed: $($bad -join ', ')" }

      - name: Pack
        run: |
          Remove-Item artifacts/signing-catalog.txt -ErrorAction SilentlyContinue
          ./build/overshell/Pack.ps1 -Version $env:VERSION -InputRoot artifacts -Platforms x64, arm64 -OutputDirectory out/packages
          Compress-Archive -Path symbols/* -DestinationPath "out/OverShell.Terminal.Wpf.$env:VERSION.native-symbols.zip"
          Get-FileHash out/packages/*.nupkg, out/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } | Set-Content out/SHA256SUMS.txt
          Get-ChildItem out -Recurse -File | ForEach-Object { '{0,10:N0} KB  {1}' -f ($_.Length / 1KB), $_.Name }
          Get-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.VERSION }}
          path: |
            out/packages/*.nupkg
            out/*.zip
            out/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: GitHub release + nuget.org
    needs: [version, pack]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write   # the GitHub release and its assets
      id-token: write   # the OIDC token NuGet/login exchanges for a short-lived API key
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.VERSION }}
          path: out/
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(sed -n 's/^commit=//p' build/overshell/UPSTREAM)"
          notes="$(printf '%s\n' \
            "OverShell.Terminal.Wpf ${VERSION} - the Windows Terminal WPF control built from this tree." \
            "" \
            "Upstream base: microsoft/terminal@${upstream}. Patches on top of it: build/overshell/README.md at this tag." \
            "" \
            "Assets: the NuGet package (also on nuget.org as OverShell.Terminal.Wpf), the native PDBs per platform, SHA256SUMS.txt.")"
          # Idempotent, so a re-run after a failed nuget.org step does not stop here.
          if gh release view "wpf-v${VERSION}" >/dev/null 2>&1; then
            echo "release wpf-v${VERSION} exists; replacing its assets"
            gh release upload "wpf-v${VERSION}" --clobber out/packages/*.nupkg out/*.zip out/SHA256SUMS.txt
          else
            gh release create "wpf-v${VERSION}" --verify-tag --title "OverShell.Terminal.Wpf ${VERSION}" --notes "${notes}" out/packages/*.nupkg out/*.zip out/SHA256SUMS.txt
          fi

      - name: NuGet login (OIDC -> short-lived API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for pkg in out/packages/*.nupkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
